[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redactor"
version = "0.0.1"
description = "A privacy gateway: bidirectional alias proxy for safe conversations about sensitive data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "smartsquared" }]
# SQLCipher-backed local store (see docs/adr/0001-encryption-at-rest.md).
# sqlcipher3 ships a manylinux wheel with libsqlcipher bundled — no system lib needed.
# presidio-analyzer provides the detection recognizer framework we wrap (story
# S1.1). We use only its pattern/deny-list recognizers, invoked directly — no
# spaCy NlpEngine, so no language-model download is needed in CI.
dependencies = [
    "sqlcipher3>=0.5",
    "presidio-analyzer>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "hypothesis>=6",
]

[project.scripts]
redactor-fakeness = "redactor.fakeness:main"

[tool.setuptools.packages.find]
include = ["redactor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
